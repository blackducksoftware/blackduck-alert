plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')

    // Two Jackson BOMs are required because Spring Boot 4.x migrated to Jackson 3.x (tools.jackson),
    // while several transitive dependencies still depend on Jackson 2.x (com.fasterxml.jackson):
    //   - zjsonpatch (via com.blackduck.integration:integration-common)
    //   - metrics-json (via opensaml-core-impl)
    //   - swagger-core-jakarta (via springdoc-openapi-starter-webmvc-ui)
    // Both BOMs pin their respective lines to security-patched versions.
    // Remove com.fasterxml.jackson:jackson-bom once all of the above have migrated to tools.jackson,
    // and migrate Alert's own com.fasterxml.jackson imports in alert-common, api-common-model,
    // channel-email, channel-jira-cloud, provider-blackduck, and web.
    api platform('com.fasterxml.jackson:jackson-bom:2.22.4')
    api platform('tools.jackson:jackson-bom:3.2.4')

    constraints {
        api 'com.github.springtestdbunit:spring-test-dbunit:1.3.0'
        api 'org.dbunit:dbunit:2.7.3'
        api 'com.playtika.testcontainers:embedded-postgresql:4.0.4'
        api 'com.playtika.testcontainers:embedded-rabbitmq:4.0.4'
        api 'jakarta.servlet:jakarta.servlet-api:6.0.0'

        api 'org.jsoup:jsoup:1.15.4'

        api 'com.blackduck.integration:blackduck-common:68.0.1'
        api 'com.blackduck.integration:int-jira-common:6.0.3'

        // The below 2 dependencies should match what comes in via blackduck-common above
        api 'com.blackduck.integration:integration-rest:11.1.4'
        api 'com.blackduck.integration:integration-common:27.0.4'

        api 'com.google.cloud:libraries-bom:2.2.0'
        api 'com.google.oauth-client:google-oauth-client:1.34.1'
        api 'com.google.http-client:google-http-client-apache-v2:1.36.0'
        api 'com.google.http-client:google-http-client-jackson2:1.36.0'
        api 'com.google.guava:guava:33.7.2-jre'

        api 'org.javassist:javassist:3.29.2-GA'
        api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

        // Enforced via resolutionStrategy.force in root build.gradle allprojects block.
        api "org.apache.tomcat.embed:tomcat-embed-core:${rootProject.ext.tomcatVersion}"
        api "org.apache.tomcat:tomcat-annotations-api:${rootProject.ext.tomcatVersion}"

        api "org.opensaml:opensaml-core-api:5.2.3"
        api "org.opensaml:opensaml-saml-api:5.2.3"
        api "org.opensaml:opensaml-saml-impl:5.2.3"
    }
}
